                        <body>
                            <!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>貪食蛇遊戲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #fff;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 400px;
  }

  h1 {
    font-size: 2rem;
    text-shadow: 0 0 15px rgba(81, 225, 179, 0.6);
    letter-spacing: 3px;
  }

  .score-board {
    display: flex;
    justify-content: center;
    gap: 40px;
    font-size: 1.1rem;
  }

  .score-board span {
    background: rgba(255, 255, 255, 0.1);
    padding: 6px 18px;
    border-radius: 20px;
    backdrop-filter: blur(5px);
  }

  .score-board b { color: #51e1b3; }

  /* ===== 遊戲區域（會依螢幕縮放） ===== */
  #gameArea {
    position: relative;
    width: 400px;
    height: 400px;
    transform-origin: center center;
    /* 縮放時保持清晰、不改變版面位置 */
    will-change: transform;
  }

  canvas {
    background: #0d1b2a;
    border: 3px solid #51e1b3;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(81, 225, 179, 0.3);
    display: block;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(13, 27, 42, 0.85);
    border-radius: 12px;
    gap: 15px;
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    font-size: 2.5rem;
    text-shadow: 0 0 15px rgba(81, 225, 179, 0.6);
  }

  .overlay p { font-size: 1.1rem; opacity: 0.9; }

  .overlay .final-score { font-size: 1.4rem; color: #51e1b3; }

  .hint { font-size: 0.9rem; opacity: 0.7; text-align: center; }

  .key {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    padding: 2px 8px;
    border-radius: 5px;
    margin: 0 2px;
  }

  /* ===== 按鈕通用樣式 ===== */
  .btn {
    background: linear-gradient(135deg, #51e1b3, #2ecc71);
    color: #0d1b2a;
    border: none;
    padding: 12px 36px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(81, 225, 179, 0.4);
    transition: transform 0.1s, box-shadow 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: scale(0.95);
    box-shadow: 0 2px 8px rgba(81, 225, 179, 0.4);
  }

  /* ===== 暫停浮動按鈕 ===== */
  .pause-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid #51e1b3;
    color: #51e1b3;
    font-size: 1.3rem;
    cursor: pointer;
    display: none;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(5px);
    -webkit-tap-highlight-color: transparent;
    z-index: 5;
  }

  .pause-btn.visible { display: flex; }

  .pause-btn:active {
    background: rgba(81, 225, 179, 0.3);
    transform: scale(0.92);
  }
</style>
</head>
<body>
  <div class="game-container">
    <h1>貪食蛇</h1>
    <div class="score-board">
      <span>得分: <b id="score">0</b></span>
      <span>最高分: <b id="highScore">0</b></span>
    </div>

    <!-- 可縮放的遊戲區域 -->
    <div id="gameArea">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- 暫停浮動按鈕 -->
      <button class="pause-btn" id="pauseBtn" aria-label="暫停">⏸</button>

      <!-- 開始畫面 -->
      <div class="overlay" id="startScreen">
        <h2>貪食蛇遊戲</h2>
        <button class="btn" id="startBtn">開始遊戲</button>
        <p class="hint">手機：滑動螢幕或點擊按鈕 ｜ 電腦：方向鍵或 WASD</p>
      </div>

      <!-- 暫停畫面 -->
      <div class="overlay hidden" id="pauseScreen">
        <h2>遊戲暫停</h2>
        <button class="btn" id="continueBtn">繼續遊戲</button>
        <p class="hint">或滑渡螢幕 / 點擊右上方按鈕繼續</p>
      </div>

      <!-- 遊戲結束畫面 -->
      <div class="overlay hidden" id="gameOverScreen">
        <h2>遊戲結束</h2>
        <p class="final-score">本次得分: <span id="finalScore">0</span></p>
        <p>最高分: <span id="finalHighScore">0</span></p>
        <button class="btn" id="restartBtn">再玩一次</button>
      </div>
    </div>

    <p class="hint">空格鍵：開始 / 暫停 ｜ 方向鍵或 WASD 控制方向</p>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake, food, direction, nextDirection;
let score, highScore, gameSpeed;
let gameLoop;
let gameState = 'start';

const startScreen = document.getElementById('startScreen');
const pauseScreen = document.getElementById('pauseScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const finalScoreEl = document.getElementById('finalScore');
const finalHighScoreEl = document.getElementById('finalHighScore');

const startBtn = document.getElementById('startBtn');
const continueBtn = document.getElementById('continueBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');
const gameArea = document.getElementById('gameArea');

// 觸控（滑渡）變數
let touchStartX = 0;
let touchStartY = 0;
let touchStarted = false;

highScore = localStorage.getItem('snakeHighScore') || 0;
highScoreEl.textContent = highScore;

/* ===== 自動縮放 & 居中 ===== */
function resizeGame() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // 預留空間：標題 + 分數板 + 底部提示 + 邊距
  const reserve = 180;
  const padding = 20;

  const availW = vw - padding * 2;
  const availH = vh - reserve - padding;

  // 遊戲區固定 400x400，計算等比縮放比例
  const scale = Math.min(availW / 400, availH / 400);
  const finalScale = Math.max(0.35, Math.min(scale, 1));

  gameArea.style.transform = `scale(${finalScale})`;
  gameArea.style.transformOrigin = 'center center';
}

// 視圖大小改變時重新計算（含手機橫直屏切換、導覽列伸縮）
window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', () => setTimeout(resizeGame, 200));

function initGame() {
  snake = [{ x: 10, y: 10 }];
  food = spawnFood();
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  gameSpeed = 150;
  scoreEl.textContent = score;
}

function spawnFood() {
  let newFood;
  do {
    newFood = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
  } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
  return newFood;
}

function update() {
  direction = nextDirection;
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    gameOver();
    return;
  }

  if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    food = spawnFood();
    if (score % 50 === 0 && gameSpeed > 60) {
      gameSpeed -= 10;
      clearInterval(gameLoop);
      gameLoop = setInterval(gameTick, gameSpeed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function gameTick() {
  if (gameState === 'playing') update();
}

function draw() {
  ctx.fillStyle = '#0d1b2a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  for (let i = 1; i < tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
  }

  drawFood();

  snake.forEach((seg, index) => {
    if (index === 0) {
      ctx.fillStyle = '#51e1b3';
      ctx.shadowColor = '#51e1b3';
      ctx.shadowBlur = 12;
    } else {
      const green = Math.round(225 - (index * 4));
      ctx.fillStyle = `rgb(40, ${Math.max(green, 120)}, 150)`;
      ctx.shadowBlur = 0;
    }
    roundRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawFood() {
  const cx = food.x * gridSize + gridSize / 2;
  const cy = food.y * gridSize + gridSize / 2;
  ctx.shadowColor = '#ff6b6b';
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(cx, cy, gridSize / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#51e1b3';
  ctx.beginPath();
  ctx.moveTo(cx, cy - gridSize / 2 + 2);
  ctx.lineTo(cx + 4, cy - gridSize / 2 - 2);
  ctx.lineTo(cx + 2, cy - gridSize / 2 + 4);
  ctx.closePath();
  ctx.fill();
}

function gameOver() {
  gameState = 'over';
  clearInterval(gameLoop);
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('snakeHighScore', highScore);
  }
  highScoreEl.textContent = highScore;
  finalScoreEl.textContent = score;
  finalHighScoreEl.textContent = highScore;
  gameOverScreen.classList.remove('hidden');
  pauseBtn.classList.remove('visible');
}

function startGame() {
  initGame();
  gameState = 'playing';
  startScreen.classList.add('hidden');
  gameOverScreen.classList.add('hidden');
  pauseScreen.classList.add('hidden');
  pauseBtn.classList.add('visible');
  clearInterval(gameLoop);
  gameLoop = setInterval(gameTick, gameSpeed);
  draw();
}

function togglePause() {
  if (gameState === 'playing') {
    gameState = 'paused';
    clearInterval(gameLoop);
    pauseScreen.classList.remove('hidden');
    pauseBtn.classList.remove('visible');
  } else if (gameState === 'paused') {
    gameState = 'playing';
    pauseScreen.classList.add('hidden');
    pauseBtn.classList.add('visible');
    gameLoop = setInterval(gameTick, gameSpeed);
  }
}

function setDirection(x, y) {
  if (direction.x === -x && direction.y === -y) return;
  if (direction.x === x && direction.y === y) return;
  nextDirection = { x, y };
}

// 鍵盤控制
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (e.key === ' ' || key === ' ') {
    e.preventDefault();
    if (gameState === 'start' || gameState === 'over') startGame();
    else if (gameState === 'playing' || gameState === 'paused') togglePause();
    return;
  }
  if (gameState !== 'playing') return;
  switch (key) {
    case 'arrowup': case 'w': setDirection(0, -1); break;
    case 'arrowdown': case 's': setDirection(0, 1); break;
    case 'arrowleft': case 'a': setDirection(-1, 0); break;
    case 'arrowright': case 'd': setDirection(1, 0); break;
  }
});

// 按鈕事件
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
continueBtn.addEventListener('click', togglePause);
pauseBtn.addEventListener('click', togglePause);

// 觸控（滑渡）控制
const SWIPE_THRESHOLD = 30;

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchStarted = true;
}, { passive: false });

canvas.addEventListener('touchend', function (e) {
  e.preventDefault();
  if (!touchStarted) return;
  touchStarted = false;

  const touch = e.changedTouches[0];
  const deltaX = touch.clientX - touchStartX;
  const deltaY = touch.clientY - touchStartY;

  if (Math.abs(deltaX) < SWIPE_THRESHOLD && Math.abs(deltaY) < SWIPE_THRESHOLD) {
    return;
  }

  if (Math.abs(deltaX) > Math.abs(deltaY)) {
    setDirection(deltaX > 0 ? 1 : -1, 0);
  } else {
    setDirection(0, deltaY > 0 ? 1 : -1);
  }
}, { passive: false });

document.addEventListener('touchmove', function (e) {
  if (e.target === canvas || e.target.closest('.game-container')) {
    e.preventDefault();
  }
}, { passive: false });

// 初始化：計算縮放並繪製
resizeGame();
initGame();
draw();
</script>
</body>
</html>
