<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>踩地雷遊戲</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
  }

  h1 {
    color: #fff;
    margin-bottom: 15px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .controls button {
    padding: 10px 20px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: #fff;
    color: #667eea;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  }

  .controls button.active {
    background: #ffd700;
    color: #333;
  }

  .game-info {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    align-items: center;
  }

  .info-box {
    background: rgba(255,255,255,0.9);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .reset-btn {
    font-size: 28px;
    background: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 15px;
    cursor: pointer;
    transition: transform 0.2s;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  .reset-btn:hover {
    transform: scale(1.1);
  }

  #board {
    display: grid;
    gap: 3px;
    background: #bbb;
    padding: 8px;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .cell {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #4a90d9;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
    user-select: none;
    transition: all 0.1s;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
  }

  .cell:hover:not(.revealed) {
    background: #5ba0e9;
    transform: scale(1.05);
  }

  .cell.revealed {
    background: #e8e8e8;
    box-shadow: inset 0 0 3px rgba(0,0,0,0.2);
    cursor: default;
    transform: none;
  }

  .cell.mine {
    background: #ff5252;
  }

  .cell.flag {
    background: #ffd700;
  }

  .cell.exploded {
    background: #d32f2f;
  }

  /* 數字顏色 */
  .cell.n1 { color: #1976d2; }
  .cell.n2 { color: #388e3c; }
  .cell.n3 { color: #d32f2f; }
  .cell.n4 { color: #7b1fa2; }
  .cell.n5 { color: #c2185b; }
  .cell.n6 { color: #0097a7; }
  .cell.n7 { color: #424242; }
  .cell.n8 { color: #8d6e63; }

  .message {
    margin-top: 15px;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    min-height: 30px;
  }

  .footer {
    margin-top: 20px;
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>💣 踩地雷 💣</h1>

  <div class="controls">
    <button data-level="easy" class="active">初級 9×9</button>
    <button data-level="medium">中級 16×16</button>
    <button data-level="hard">高級 30×16</button>
  </div>

  <div class="game-info">
    <div class="info-box">🚩 <span id="flag-count">0</span></div>
    <button class="reset-btn" id="reset-btn">🙂</button>
    <div class="info-box">⏱️ <span id="timer">0</span>s</div>
  </div>

  <div id="board"></div>

  <div class="message" id="message"></div>

  <div class="footer">
    左鍵點擊開啟格子 ｜ 右鍵插旗標記 ｜ 點擊表情重置遊戲
  </div>

<script>
  const board = document.getElementById('board');
  const messageEl = document.getElementById('message');
  const flagCountEl = document.getElementById('flag-count');
  const timerEl = document.getElementById('timer');
  const resetBtn = document.getElementById('reset-btn');

  const levels = {
    easy:   { rows: 9,  cols: 9,  mines: 10 },
    medium: { rows: 16, cols: 16, mines: 40 },
    hard:   { rows: 16, cols: 30, mines: 99 }
  };

  let currentLevel = 'easy';
  let grid = [];
  let revealedCount = 0;
  let flagCount = 0;
  let gameOver = false;
  let firstClick = true;
  let startTime = null;
  let timerInterval = null;

  // 開始計時器
  function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(() => {
      timerEl.textContent = Math.floor((Date.now() - startTime) / 1000);
    }, 100);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

  // 初始化遊戲
  function initGame() {
    const { rows, cols, mines } = levels[currentLevel];
    grid = [];
    revealedCount = 0;
    flagCount = 0;
    gameOver = false;
    firstClick = true;
    messageEl.textContent = '';
    resetBtn.textContent = '🙂';
    flagCountEl.textContent = mines;
    timerEl.textContent = '0';
    stopTimer();

    board.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
    board.innerHTML = '';

    for (let r = 0; r < rows; r++) {
      grid[r] = [];
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        board.appendChild(cell);

        grid[r][c] = {
          cell,
          isMine: false,
          revealed: false,
          flagged: false,
          neighbors: 0
        };

        cell.addEventListener('click', () => handleClick(r, c));
        cell.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          handleRightClick(r, c);
        });
      }
    }
  }

  // 放置地雷（確保第一次點擊安全）
  function placeMines(safeRow, safeCol) {
    const { rows, cols, mines } = levels[currentLevel];
    let placed = 0;

    while (placed < mines) {
      const r = Math.floor(Math.random() * rows);
      const c = Math.floor(Math.random() * cols);

      // 避免在第一次點擊的位置及其周圍放置地雷
      if (Math.abs(r - safeRow) <= 1 && Math.abs(c - safeCol) <= 1) {
        continue;
      }

      if (!grid[r][c].isMine) {
        grid[r][c].isMine = true;
        placed++;
      }
    }

    // 計算每個格子附近的地雷數量
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (!grid[r][c].isMine) {
          grid[r][c].neighbors = countNeighbors(r, c);
        }
      }
    }
  }

  function countNeighbors(r, c) {
    let count = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr;
        const nc = c + dc;
        if (nr >= 0 && nr < grid.length && nc >= 0 && nc < grid[0].length) {
          if (grid[nr][nc].isMine) count++;
        }
      }
    }
    return count;
  }

  // 左鍵點擊
  function handleClick(r, c) {
    if (gameOver || grid[r][c].revealed || grid[r][c].flagged) return;

    if (firstClick) {
      placeMines(r, c);
      firstClick = false;
      startTimer();
    }

    if (grid[r][c].isMine) {
      explodeMine(r, c);
      return;
    }

    reveal(r, c);
    checkWin();
  }

  // 展開格子（遞迴擴散空白區域）
  function reveal(r, c) {
    if (r < 0 || r >= grid.length || c < 0 || c >= grid[0].length) return;
    const cellData = grid[r][c];

    if (cellData.revealed || cellData.flagged) return;

    cellData.revealed = true;
    revealedCount++;
    cellData.cell.classList.add('revealed');

    if (cellData.neighbors > 0) {
      cellData.cell.textContent = cellData.neighbors;
      cellData.cell.classList.add('n' + cellData.neighbors);
    } else {
      // 空白格子，自動展開周圍
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          reveal(r + dr, c + dc);
        }
      }
    }
  }

  // 右鍵插旗
  function handleRightClick(r, c) {
    if (gameOver || grid[r][c].revealed) return;

    const cellData = grid[r][c];
    const { mines } = levels[currentLevel];

    if (cellData.flagged) {
      cellData.flagged = false;
      cellData.cell.textContent = '';
      cellData.cell.classList.remove('flag');
      flagCount--;
    } else {
      cellData.flagged = true;
      cellData.cell.textContent = '🚩';
      cellData.cell.classList.add('flag');
      flagCount++;
    }

    flagCountEl.textContent = mines - flagCount;
  }

  // 引爆地雷
  function explodeMine(r, c) {
    gameOver = true;
    stopTimer();
    cellData = grid[r][c];
    cellData.cell.classList.add('exploded', 'revealed');
    cellData.cell.textContent = '💥';

    // 顯示所有地雷
    for (let i = 0; i < grid.length; i++) {
      for (let j = 0; j < grid[0].length; j++) {
        const cell = grid[i][j];
        if (cell.isMine && !cell.flagged) {
          cell.cell.classList.add('revealed', 'mine');
          if (!cell.cell.textContent) cell.cell.textContent = '💣';
        } else if (!cell.isMine && cell.flagged) {
          cell.cell.textContent = '❌';
        }
      }
    }

    resetBtn.textContent = '😵';
    messageEl.textContent = '💥 遊戲結束！你踩到地雷了';
  }

  // 檢查是否勝利
  function checkWin() {
    const { rows, cols, mines } = levels[currentLevel];
    const totalCells = rows * cols;

    if (revealedCount === totalCells - mines) {
      gameOver = true;
      stopTimer();
      resetBtn.textContent = '😎';
      messageEl.textContent = '🎉 恭喜你勝利了！';

      // 自動標記剩雷
      for (let r = 0; r < grid.length; r++) {
        for (let c = 0; c < grid[0].length; c++) {
          const cell = grid[r][c];
          if (cell.isMine && !cell.flagged) {
            cell.cell.textContent = '🚩';
            cell.cell.classList.add('flag');
          }
        }
      }
      flagCountEl.textContent = 0;
    }
  }

  // 難度切換
  document.querySelectorAll('.controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLevel = btn.dataset.level;
      initGame();
    });
  });

  // 重置按鈕
  resetBtn.addEventListener('click', initGame);

  // 禁止右鍵選單
  board.addEventListener('contextmenu', (e) => e.preventDefault());

  // 啟動遊戲
  initGame();
</script>
</body>
</html>
